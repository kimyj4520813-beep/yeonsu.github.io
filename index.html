<head>

  <title>yeonsu's page</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: #202333;
      background: #f7f8fc;
      font-family: Arial, "Malgun Gothic", sans-serif;
      line-height: 1.6;
    }

    header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid #e5e7ef;
    }

    nav {
      max-width: 1000px;
      margin: auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      color: #202333;
      text-decoration: none;
      margin-left: 20px;
      font-weight: bold;
    }

    nav a:hover {
      color: #6257d9;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 48px 24px;
    }

    .intro {
      padding: 64px 0;
    }

    .intro h1 {
      margin: 0;
      font-size: clamp(36px, 7vw, 64px);
      line-height: 1.15;
    }

    .intro p {
      max-width: 600px;
      color: #626779;
      font-size: 18px;
    }

    .button {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 20px;
      color: white;
      background: #6257d9;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }

    section {
      padding: 40px 0;
      scroll-margin-top: 80px;
    }

    h2 {
      font-size: 28px;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .card {
      padding: 22px;
      background: white;
      border: 1px solid #e5e7ef;
      border-radius: 14px;
    }

    .card p {
      color: #626779;
    }

    .contact {
      padding: 24px;
      background: #eeedff;
      border-radius: 14px;
    }

    footer {
      padding: 24px;
      color: #777b89;
      text-align: center;
    }
  </style>
</head>
